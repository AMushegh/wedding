<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You're invited to celebrate the wedding of Armen & Anna. Join us on August 30, 2025, for a joyful day full of love and memories."
    />
    <meta property="og:url" content="https://www.armenannawedding.party" />
    <meta property="og:title" content="Armen & Anna's Wedding Invitation" />
    <meta
      property="og:description"
      content="You're invited to celebrate the wedding of Armen & Anna. Join us on August 30, 2025, for a joyful day full of love and memories."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://www.armenannawedding.party/assets/images/cropped-2.webp"
    />
    <meta name="twitter:title" content="Armen & Annas's Wedding Invitation" />
    <meta
      name="twitter:description"
      content="You're invited to celebrate the wedding of Armen & Anna. Join us on August 30, 2025, for a joyful day full of love and memories."
    />
    <meta
      name="twitter:image"
      content="https://www.armenannawedding.party/assets/images/cropped-2.webp"
    />
    <title>Armen & Anna's wedding</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="section-main">
        <div class="bg-parallax">
          <div class="main-wrapper">
            <h1>ՍԻՐՈՎ ՍՊԱՍՈՒՄ ԵՆՔ</h1>
            <p>30.08.2025</p>
          </div>
        </div>
      </div>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">Հետհաշվարկ</h2>
          <div class="section-content">
            <div id="countdown" class="countdown">
              <div class="time">
                <h3 id="days">00</h3>
                <small class="time-name">Օր</small>
              </div>

              <div class="time">
                <h3 id="hours">00</h3>
                <small class="time-name">Ժամ</small>
              </div>

              <div class="time">
                <h3 id="minutes">00</h3>
                <small class="time-name">Րոպե</small>
              </div>

              <div class="time">
                <h3 id="seconds">00</h3>
                <small class="time-name">Վարկյան</small>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">Երբ և Որտեղ</h2>
          <div class="section-content wedding-info">
            <div class="event-info">
              <div class="info-img-container">
                <img src="../assets/images/church.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Ամսաթիվ:</span>
                  <span>30 ՕԳՍ 2025</span>
                </div>
                <div class="event-row">
                  <span>Ժամ:</span>
                  <span>14:00</span>
                </div>
                <div class="event-row">
                  <span>Վայր:</span>
                  <span>ՍՈՒՐԲ ԳԱՅԱՆԵ ԵԿԵՂԵՑԻ</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger1">
                    Ինչպես Հասնել
                  </div>
                </div>
              </div>
            </div>
            <div class="event-info">
              <div class="info-img-container">
                <img src="../assets/images/glass.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Ամսաթիվ:</span>
                  <span>30 ՕԳՍ 2025</span>
                </div>
                <div class="event-row">
                  <span>Ժամ:</span>
                  <span>17:30</span>
                </div>
                <div class="event-row">
                  <span>Վայր:</span>
                  <span>ՖԼՈՐԵՆՍ ՌԵՍՏՈՐԱՆ</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger2">
                    Ինչպես Հասնել
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="section-container wedding-data">
          <div class="swiper mySwiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/5.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/1.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/2.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/3.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/4.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/6.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/images/slider/7.webp"
                  alt="Anna Armen Wedding Image"
                />
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="popup-backdrop hidden" id="popupBackdrop">
        <div class="popup">
          <div class="popup-header">
            <h3 class="popup-title"></h3>
            <button class="popup-close-btn" id="popupCloseBtn">&times;</button>
          </div>
          <div class="popup-content">
            <ul class="popup-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../src/main.js"></script>
  </body>
</html>
