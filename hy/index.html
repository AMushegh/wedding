<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Հրավիրում ենք տոնելու Հրաչի և Լիայի հարսանիքը։ Միացե՛ք մեզ 2026 թվականի հունիսի 28-ին՝ սիրով և հիշարժան պահերով լի օրվա համար։"
    />
    <meta property="og:url" content="https://www.hlwedding.am" />
    <meta property="og:title" content="Հրաչի և Լիայի հարսանիքի հրավեր" />
    <meta
      property="og:description"
      content="Հրավիրում ենք տոնելու Հրաչի և Լիայի հարսանիքը։ Միացե՛ք մեզ 2026 թվականի հունիսի 28-ին՝ սիրով և հիշարժան պահերով լի օրվա համար։"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://www.hlwedding.am/assets/images/parallax.webp"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Հրաչի և Լիայի հարսանիքի հրավեր" />
    <meta
      name="twitter:description"
      content="Հրավիրում ենք տոնելու Հրաչի և Լիայի հարսանիքը։ Միացե՛ք մեզ 2026 թվականի հունիսի 28-ին՝ սիրով և հիշարժան պահերով լի օրվա համար։"
    />
    <meta
      name="twitter:image"
      content="https://www.hlwedding.am/assets/images/parallax.webp"
    />
    <title>Հրաչի և Լիայի հարսանիք</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="section-main">
        <div class="bg-parallax">
          <div class="main-wrapper">
            <h1>ՍԻՐՈՎ ՍՊԱՍՈՒՄ ԵՆՔ</h1>
            <p>28.06.2026</p>
          </div>
        </div>
      </div>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">Հետհաշվարկ</h2>
          <div class="section-content">
            <div id="countdown" class="countdown">
              <div class="time">
                <h3 id="days">00</h3>
                <small class="time-name">Օր</small>
              </div>

              <div class="time">
                <h3 id="hours">00</h3>
                <small class="time-name">Ժամ</small>
              </div>

              <div class="time">
                <h3 id="minutes">00</h3>
                <small class="time-name">Րոպե</small>
              </div>

              <div class="time">
                <h3 id="seconds">00</h3>
                <small class="time-name">Վայրկյան</small>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">Երբ և Որտեղ</h2>
          <div class="section-content wedding-info">
            <div class="event-info">
              <div class="info-img-container">
                <img src="../assets/images/church.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Ամսաթիվ:</span>
                  <span>28 ՀՆՍ 2026</span>
                </div>
                <div class="event-row">
                  <span>Ժամ:</span>
                  <span>15:30</span>
                </div>
                <div class="event-row">
                  <span>Վայր:</span>
                  <span>ՍՈՒՐԲ ՍԱՐԳԻՍ ԵԿԵՂԵՑԻ</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger1">
                    Ինչպես Հասնել
                  </div>
                </div>
              </div>
            </div>
            <div class="event-info">
              <div class="info-img-container">
                <img src="../assets/images/glass.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Ամսաթիվ:</span>
                  <span>28 ՀՆՍ 2026</span>
                </div>
                <div class="event-row">
                  <span>Ժամ:</span>
                  <span>17:00</span>
                </div>
                <div class="event-row">
                  <span>Վայր:</span>
                  <span>Palermo Hall</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger2">
                    Ինչպես Հասնել
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <img
          src="/assets/images/bg.jpg"
          alt="When and where"
          class="when-where-banner"
        />
      </footer>
      <div class="popup-backdrop hidden" id="popupBackdrop">
        <div class="popup">
          <div class="popup-header">
            <h3 class="popup-title"></h3>
            <button class="popup-close-btn" id="popupCloseBtn">&times;</button>
          </div>
          <div class="popup-content">
            <ul class="popup-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../src/main.js"></script>
  </body>
</html>
