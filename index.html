<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armen & Anna's wedding</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="section-main">
        <div class="bg-parallax">
          <div class="main-wrapper">
            <h1>SAVE THE DATE</h1>
            <p>30.08.2025</p>
          </div>
        </div>
      </div>

      <section class="section">
        <div class="section-container">
          <h3 class="section-title">Countdown</h3>
          <div class="section-content">
            <div id="countdown" class="countdown">
              <div class="time">
                <h2 id="days">00</h2>
                <small class="time-name">Days</small>
              </div>

              <div class="time">
                <h2 id="hours">00</h2>
                <small class="time-name">Hours</small>
              </div>

              <div class="time">
                <h2 id="minutes">00</h2>
                <small class="time-name">Minutes</small>
              </div>

              <div class="time">
                <h2 id="seconds">00</h2>
                <small class="time-name">Seconds</small>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-container wedding-data">
          <h3 class="section-title">When & Where</h3>
          <div class="section-content wedding-info">
            <div class="event-info">
              <div class="info-img-container">
                <img src="./assets/images/church.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Date:</span>
                  <span>30 Aug 2025</span>
                </div>
                <div class="event-row">
                  <span>Time:</span>
                  <span>13:30</span>
                </div>
                <div class="event-row">
                  <span>Location:</span>
                  <span class="tooltipTrigger" id="tooltipTrigger1"
                    >Hovhannavank Monastery</span
                  >
                </div>
              </div>
            </div>
            <div class="event-info">
              <div class="info-img-container">
                <img src="./assets/images/glass.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Date:</span>
                  <span>30 Aug 2025</span>
                </div>
                <div class="event-row">
                  <span>Time:</span>
                  <span>17:30</span>
                </div>
                <div class="event-row">
                  <span>Location:</span>
                  <a class="tooltipTrigger" id="tooltipTrigger2"
                    >Florence Restaurant</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <img
          src="./assets/images/bg.jpg"
          alt="When and where"
          class="when-where-banner"
        />
      </footer>
      <div class="popup-backdrop hidden" id="popupBackdrop">
        <div class="popup">
          <div class="popup-header">
            <h3 class="popup-title"></h3>
            <button class="popup-close-btn" id="popupCloseBtn">&times;</button>
          </div>
          <div class="popup-content">
            <ul class="popup-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
