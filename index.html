<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You're invited to celebrate the wedding of Hrach & Lia. Join us on June 28, 2026, for a joyful day full of love and memories."
    />
    <meta property="og:title" content="Hrach & Lia's Wedding Invitation" />
    <meta
      property="og:description"
      content="You're invited to celebrate the wedding of Hrach & Lia. Join us on June 28, 2026, for a joyful day full of love and memories."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="Hrach & Lia's Wedding Invitation" />
    <meta
      name="twitter:description"
      content="You're invited to celebrate the wedding of Hrach & Lia. Join us on June 28, 2026, for a joyful day full of love and memories."
    />
    <meta
      name="twitter:image"
      content="https://www.armenannawedding.party/assets/images/cropped-2.webp"
    />
    <title>Hrach & Lia's wedding</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="section-main">
        <div class="bg-parallax">
          <div class="main-wrapper">
            <h1>SAVE THE DATE</h1>
            <p>28.06.2026</p>
          </div>
        </div>
      </div>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">Countdown</h2>
          <div class="section-content">
            <div id="countdown" class="countdown">
              <div class="time">
                <h3 id="days">00</h3>
                <small class="time-name">Days</small>
              </div>

              <div class="time">
                <h3 id="hours">00</h3>
                <small class="time-name">Hours</small>
              </div>

              <div class="time">
                <h3 id="minutes">00</h3>
                <small class="time-name">Minutes</small>
              </div>

              <div class="time">
                <h3 id="seconds">00</h3>
                <small class="time-name">Seconds</small>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-container">
          <h2 class="section-title">When & Where</h2>
          <div class="section-content wedding-info">
            <div class="event-info">
              <div class="info-img-container">
                <img src="./assets/images/church.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Date:</span>
                  <span>28 Jun 2026</span>
                </div>
                <div class="event-row">
                  <span>Time:</span>
                  <span>15:30</span>
                </div>
                <div class="event-row">
                  <span>Location:</span>
                  <span>Saint Sargis Church</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger1">
                    How To Reach?
                  </div>
                </div>
              </div>
            </div>
            <div class="event-info">
              <div class="info-img-container">
                <img src="./assets/images/glass.png" alt="Location" />
              </div>
              <div class="info-desc">
                <div class="event-row">
                  <span>Date:</span>
                  <span>28 Jun 2026</span>
                </div>
                <div class="event-row">
                  <span>Time:</span>
                  <span>17:00</span>
                </div>
                <div class="event-row">
                  <span>Location:</span>
                  <span>Palermo Hall</span>
                </div>
                <div class="event-row">
                  <div class="tooltipTrigger" id="tooltipTrigger2">
                    How To Reach?
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <img
          src="/assets/images/bg.jpg"
          alt="When and where"
          class="when-where-banner"
        />
      </footer>
      <div class="popup-backdrop hidden" id="popupBackdrop">
        <div class="popup">
          <div class="popup-header">
            <h3 class="popup-title"></h3>
            <button class="popup-close-btn" id="popupCloseBtn">&times;</button>
          </div>
          <div class="popup-content">
            <ul class="popup-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
